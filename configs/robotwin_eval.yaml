# RoboTwin 2.0 — dual-arm manipulation (grab_roller, 1 episode for testing)
server:
  url: "wss://8000--main--xiaoxiong-8gpu-0--xiaoxiong-sherry.coder.lionrock.com"

docker:
  image: ghcr.io/allenai/vla-evaluation-harness/robotwin:latest
  gpus: "4,5,6,7"
  volumes:
    - "/home/xiongxiao/repo/vla-evaluation-harness/configs/robotwin_task_configs/agilex_random.yml:/app/RoboTwin/task_config/agilex_random.yml"

output_dir: "./results"

benchmarks:
  - benchmark: "vla_eval.benchmarks.robotwin.benchmark:RoboTwinBenchmark"
    mode: sync
    episodes_per_task: 1
    params:
      task_name: beat_block_hammer
      task_config: agilex_random
      seed: 0
      instruction_type: unseen
      test_num: 10
      skip_expert_check: false
    action_dim: 14


