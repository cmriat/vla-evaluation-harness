# GR00T-Base (N1.5) model server — RoboTwin checkpoint
# Requires: external/LLVM submodule with susser-tod initialised
#
# Usage: vla-eval serve --config configs/model_servers/groot_base.yaml

script: "src/vla_eval/model_servers/groot_base.py"
args:
  model_path: /data/checkpoints/gr00t-n1.5-base-finetune/epoch-60
  train_data_path: /data/robotwin/gr00t_train_multi_data
  embodiment_tag: robotwin/agilex_random
  denoising_steps: 8
  chunk_size: 16
  max_batch_size: 1      # <-- 默认 1，调大开启 batching
  max_wait_time: 0.05     # <-- 等 50ms 凑max_batch_size数量
  port: 8002
